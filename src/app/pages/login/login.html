<main class="login-page">
  <section class="login-card">
    <a routerLink="/" class="back-link">← Volver al inicio</a>

    <div class="brand-mark" aria-hidden="true">📚</div>
    <p class="eyebrow">APRENDIZAJE PARA TODOS</p>
    <h1>¡Qué bueno tenerte aquí!</h1>
    <p class="intro">Ingresa a tu espacio de aprendizaje.</p>

    <form (ngSubmit)="ingresar()" #loginForm="ngForm">
      <label for="usuario">Nombre de usuario</label>
      <input
        id="usuario"
        name="usuario"
        type="text"
        [(ngModel)]="usuario"
        placeholder="Escribe tu usuario"
        autocomplete="username"
        required>

      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        name="contrasena"
        type="password"
        [(ngModel)]="contrasena"
        placeholder="Escribe tu contraseña"
        autocomplete="current-password"
        required>

      <label for="perfil">Voy a ingresar como</label>
      <select id="perfil" name="perfil" [(ngModel)]="perfil">
        <option value="estudiante">Estudiante</option>
        <option value="docente">Docente</option>
      </select>

      <button type="submit" [disabled]="loginForm.invalid">
        Iniciar sesión
      </button>
    </form>

    <p class="notice" *ngIf="mensaje" role="status">{{ mensaje }}</p>
    <p class="security-note">Tu espacio educativo, donde cada día es una oportunidad para crecer.</p>
  </section>
</main>
